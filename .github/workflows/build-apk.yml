# Cloud build fallback: push this project to GitHub from Termux (git push) and
# download the APK from the workflow's "Artifacts". Not executed in the authoring environment.
name: Build debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests + debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
